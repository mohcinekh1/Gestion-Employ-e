spring.application.name=backend

# --- MySQL (XAMPP par defaut : port 3306, utilisateur root, mot de passe vide) ---
# La base hr_manager est creee si elle n'existe pas. Les tables sont creees/mises a jour par Hibernate (ddl-auto=update).
# Mot de passe root non vide : definir la variable d'environnement SPRING_DATASOURCE_PASSWORD (recommande) ou modifier la ligne suivante.
spring.datasource.url=jdbc:mysql://localhost:3306/hr_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
# La variable d'environnement SPRING_DATASOURCE_PASSWORD (si definie) remplace automatiquement le mot de passe.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.secret=Y2hhbmdlLXRoaXMtc2VjcmV0LWtleS1pbi1lbnYtZm9yLXByb2QtdXNl
jwt.expiration-ms=86400000

# RéférenceDataBootstrap : départements + compte admin (si absent ou e-mail admin manquant) :
# identifiant admin OU e-mail admin@hrmanager.local / mot de passe Admin123! (avec le !)
# Réaligner l'e-mail du compte admin au démarrage (ex. .com -> .local) — désactivable avec false
hr.bootstrap.sync-admin-email=true
# true une fois si le mot de passe du user « admin » ne marche pas, puis repassez à false
hr.bootstrap.reset-admin-password=false

# Admin de démo (créé au démarrage si absent) : admin@gmail.com / 123456789 — true réencode le mot de passe une fois si besoin
hr.bootstrap.reset-gmail-demo-admin-password=false
