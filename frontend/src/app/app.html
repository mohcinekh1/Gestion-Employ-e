@if (authService.isAuthenticated()) {
  <div class="shell" [class.shell--nav-open]="shellUi.mobileNavOpen()">
    <div class="main-column">
      @if (shellUi.mobileNavOpen()) {
        <div
          class="mobile-nav-backdrop"
          role="presentation"
          aria-hidden="true"
          (click)="shellUi.closeMobileNav()"
        ></div>
      }
      <app-topbar />
      <main class="main-scroll">
        <router-outlet />
      </main>
    </div>
    <app-sidebar />
  </div>
} @else {
  <router-outlet />
}
