<section class="cal-card panel">
  <header class="cal-head">
    <button type="button" mat-icon-button aria-label="Mois précédent" class="nav-btn" (click)="prevMonth()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <h3 class="cal-title">{{ monthTitle() }}</h3>
    <button type="button" mat-icon-button aria-label="Mois suivant" class="nav-btn" (click)="nextMonth()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </header>

  <div class="dow-grid">
    @for (lab of weekLabels; track lab) {
      <span class="dow">{{ lab }}</span>
    }
  </div>

  <div class="cells">
    @for (cell of gridCells(); track $index) {
      @if (cell === null) {
        <div class="cell cell--empty"></div>
      } @else {
        <div
          class="cell"
          [class.cell--today]="isToday(cell)"
        >
          <span class="day-num">{{ cell.day.toLocaleString('fr-MA') }}</span>
          <div class="segs">
            @for (a of spansApproved(cell); track a.id) {
              <span [class]="badgeClass(a.type)">{{ typeShort(a.type) }}</span>
            }
          </div>
        </div>
      }
    }
  </div>
</section>
